name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Backend unit tests — native Go (fast, first feedback) ────────────────
  backend-tests:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres for TestMigrationRoundTrip only — the handler tests use sqlmock
    # and never touch it. The test creates and drops its own throwaway database
    # rather than migrating the one named here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        env:
          GONOSUMDB: "*"
          GOPROXY: direct
        run: go mod download

      - name: Vet
        env:
          GONOSUMDB: "*"
          GOPROXY: direct
        run: go vet ./...

      - name: Test (with race detector)
        env:
          GONOSUMDB: "*"
          GOPROXY: direct
          # Enables the up→down→up migration round trip. REQUIRE_DB turns a
          # missing URL into a failure instead of a skip, so the check cannot
          # quietly stop running if this wiring is ever broken.
          MIGRATE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          MIGRATE_TEST_REQUIRE_DB: "1"
        run: go test -race -v -count=1 -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  # ── 2. Frontend unit tests — native Node (fast, first feedback) ─────────────
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      # Must match the Node version used to generate package-lock.json (node:20).
      # Using Node 22+ causes an npm ci lockfile sync error.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --silent

      - name: Test (CI mode, with coverage)
        run: npm run test:ci
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ── 3. Backend Docker test image — build + run ───────────────────────────────
  # Verifies that the test Dockerfile itself builds and all tests pass inside it.
  # Uses golang:1.22 (Debian) so the race detector has access to gcc via CGO.
  docker-test-backend:
    name: Docker Test — Backend
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Build backend test image
        run: |
          docker build \
            -f backend/Dockerfile.test \
            -t finance-test-backend:ci \
            ./backend

      - name: Run backend tests in Docker
        run: |
          docker run --rm \
            -e GONOSUMDB='*' \
            -e GOPROXY=direct \
            finance-test-backend:ci

  # ── 4. Frontend Docker test image — build + run ──────────────────────────────
  # Verifies that the frontend test Dockerfile builds and all Jest tests pass.
  docker-test-frontend:
    name: Docker Test — Frontend
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Build frontend test image
        run: |
          docker build \
            -f frontend/Dockerfile.test \
            -t finance-test-frontend:ci \
            ./frontend

      - name: Run frontend tests in Docker
        run: |
          docker run --rm \
            -e CI=true \
            finance-test-frontend:ci

  # ── 5. Production Docker build — backend + frontend ──────────────────────────
  # Verifies the production Dockerfiles still build cleanly after every change.
  # Runs after all tests pass so a broken build doesn't waste test runner time.
  docker-build:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: [docker-test-backend, docker-test-frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build backend production image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          build-args: |
            GONOSUMDB=*
            GOPROXY=direct
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build frontend production image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod
