services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — see .env.example}
      POSTGRES_DB: ${DB_NAME:-finance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"       # expose for local psql / GUI tools; remove in prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Go API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — see .env.example}
      DB_NAME: ${DB_NAME:-finance}
      # No default — the API will refuse to start if this is missing or < 32 chars.
      # Generate with: make secret
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run 'make secret' and add it to .env}
      PORT: 8081
      TZ: ${TZ:-Australia/Sydney}
    ports:
      - "8081:8081"       # expose for direct API testing; nginx proxies in prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── React Frontend ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"         # access the app at http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:          # named volume — data persists across restarts
